name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_NMSXVnereosL7KURBgMnsZ59
  VERCEL_PROJECT_ID: prj_bUTJ5GAGIV3OE1UvRBAaZ3TyeYGS  # frontend (sentinel)

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (sentinel-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel (backend builds on Vercel via buildCommand in vercel.json)
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

  # ── Frontend ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (sentinel)
    runs-on: ubuntu-latest
    needs: deploy-backend   # wait for backend to be ready first
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build
        env:
          VITE_API_URL: ''

      - name: Prepare Vercel output (prebuilt)
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/api/(.*)", "dest": "https://sentinel-api-sigma.vercel.app/api/$1" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Deploy Frontend to Vercel Production
        run: npx vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
