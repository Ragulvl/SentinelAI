name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_NMSXVnereosL7KURBgMnsZ59
  VERCEL_FRONTEND_PROJECT_ID: prj_bUTJ5GAGIV3OE1UvRBAaZ3TyeYGS   # sentinel (frontend)
  VERCEL_BACKEND_PROJECT_ID: prj_3vTaPfgOsNe3YmPowxOTMdS1GFhY    # sentinel-api (backend)

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (sentinel-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Backend to Vercel Production
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_BACKEND_PROJECT_ID }}

  # ── Frontend ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (sentinel)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Step 1: Let Vercel CLI build the project (respects vercel.json, sets correct output format)
      - name: Build via Vercel CLI
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_FRONTEND_PROJECT_ID }}

      # Step 2: Deploy the prebuilt output to production
      - name: Deploy Frontend to Vercel Production
        run: npx vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_FRONTEND_PROJECT_ID }}
