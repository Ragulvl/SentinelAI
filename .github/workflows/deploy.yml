name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_NMSXVnereosL7KURBgMnsZ59
  VERCEL_FRONTEND_PROJECT_ID: prj_bUTJ5GAGIV3OE1UvRBAaZ3TyeYGS   # sentinel (frontend)
  VERCEL_BACKEND_PROJECT_ID: prj_3vTaPfgOsNe3YmPowxOTMdS1GFhY    # sentinel-api (backend)

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (sentinel-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm ci

      - name: Bundle backend with esbuild
        run: npm run build:lambda

      - name: Prepare Vercel Build Output (prebuilt)
        run: |
          mkdir -p .vercel/output/functions/api/index.func
          cp api/index.js .vercel/output/functions/api/index.func/index.js
          printf '{"runtime":"nodejs20.x","handler":"index.js","launcherType":"Nodejs","shouldAddHelpers":true}' \
            > .vercel/output/functions/api/index.func/.vc-config.json
          printf '{"version":3,"routes":[{"src":"/(.*)","dest":"/api/index"}]}' \
            > .vercel/output/config.json

      - name: Deploy Backend to Vercel Production
        run: npx vercel deploy --prod --prebuilt --force --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_BACKEND_PROJECT_ID }}

  # ── Frontend ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (sentinel)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite app
        run: npm run build:frontend   # runs locally where vite IS available

      # Create Vercel Build Output API v3 structure
      # vercel.json rewrites are NOT applied with --prebuilt, so API proxy must be in config.json
      - name: Prepare prebuilt output
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "src": "^/api/(.*)", "dest": "https://sentinel-api-sigma.vercel.app/api/$1" },
              { "src": "^/health$",  "dest": "https://sentinel-api-sigma.vercel.app/health" },
              { "handle": "filesystem" },
              { "src": "/(.*)",      "dest": "/index.html" }
            ]
          }
          EOF

      - name: Deploy Frontend to Vercel Production
        run: npx vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_FRONTEND_PROJECT_ID }}
